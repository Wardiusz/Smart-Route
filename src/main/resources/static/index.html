<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartRoute – ciekawsza droga z A do B</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div>
        <h1>SmartRoute</h1>
        <p class="subtitle">Jedziesz z A do B? AI zaproponuje ciekawszą drogę – Ty decydujesz.</p>
    </div>
    <span id="ai-badge" class="badge">…</span>
</header>

<main class="layout">
    <aside class="panel">
        <section class="card">
            <h2>Twoje preferencje</h2>
            <form id="profile-form">
                <label>Imię
                    <input id="p-name" required maxlength="60" placeholder="np. Ania">
                </label>

                <fieldset>
                    <legend>Co lubisz?</legend>
                    <div id="p-interests" class="chips"></div>
                </fieldset>

                <label>Środek transportu
                    <select id="p-mode"></select>
                </label>

                <label>Dodatkowy czas, jaki możesz poświęcić: <strong id="p-extra-label"></strong>
                    <input id="p-extra" type="range" min="15" max="240" step="15" value="120">
                </label>

                <label>Maks. liczba przystanków
                    <input id="p-stops" type="number" min="1" max="5" value="2">
                </label>

                <label>Coś jeszcze? <span class="hint">(AI weźmie to pod uwagę)</span>
                    <textarea id="p-notes" maxlength="500" rows="3"
                              placeholder="np. jadę z dziećmi, lubię zamki, nie chcę długo chodzić"></textarea>
                </label>

                <button type="submit" class="secondary">Zapisz preferencje</button>
                <span id="profile-status" class="status"></span>
            </form>
        </section>
    </aside>

    <section class="content">
        <section class="card">
            <h2>Dokąd jedziesz?</h2>
            <form id="trip-form" class="trip-form">
                <label>Skąd
                    <input id="t-origin" list="place-options" autocomplete="off" required>
                </label>
                <button type="button" id="swap" class="icon" title="Zamień">⇄</button>
                <label>Dokąd
                    <input id="t-destination" list="place-options" autocomplete="off" required>
                </label>
                <datalist id="place-options"></datalist>
                <button type="submit" id="plan-btn">Zaproponuj trasę</button>
            </form>
            <p id="trip-error" class="error" hidden></p>
        </section>

        <section id="result" class="card" hidden>
            <div id="map"></div>
            <div class="compare">
                <article class="route direct">
                    <h3>Trasa standardowa</h3>
                    <p class="route-name" id="r-direct-name"></p>
                    <dl class="stats" id="r-direct-stats"></dl>
                    <button id="choose-direct" class="secondary">Zostaję przy standardowej</button>
                </article>
                <article class="route alt">
                    <h3>Propozycja AI <span id="r-source" class="badge small"></span></h3>
                    <div id="r-alt-body"></div>
                    <button id="choose-alt">Wybieram tę trasę</button>
                </article>
            </div>
            <p id="r-decision" class="decision" hidden></p>
        </section>

        <section class="card">
            <h2>Historia decyzji</h2>
            <p class="hint">Twoje wybory wpływają na kolejne rekomendacje.</p>
            <ul id="history" class="history"></ul>
        </section>
    </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
