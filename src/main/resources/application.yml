spring:
  application:
    name: Smart-Route
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:smartroute;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
    base-url: https://api.anthropic.com
    timeout-seconds: 30
  routing:
    max-candidates: 12
  road-routing:
    base-url: ${ROAD_ROUTING_URL:https://routing.openstreetmap.de}
    timeout-seconds: 10
  geocoding:
    base-url: ${GEOCODING_URL:https://photon.komoot.io}
    timeout-seconds: 5
  poi-catalog:
    sparql-url: ${POI_CATALOG_SPARQL_URL:https://query.wikidata.org/sparql}
    file: ${POI_CATALOG_FILE:data/poi-catalog.json}
    max-age: ${POI_CATALOG_MAX_AGE:30d}
    timeout-seconds: 90
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
  demo-users:
    enabled: ${DEMO_USERS_ENABLED:true}
